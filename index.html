<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" type="X-UA-Compatible" href="photos/Icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Personality Test</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
    </nav>
    <div class="welcome">
      <img class="header-image" src="photos/personality-tests.webp" alt="header image" />
      <div class="start-test" onclick="startTest()">Start test <i class="fas fa-arrow-right"></i></div>
    </div>

    <div class="container">
      <div class="question-container">
        <div id="question-count"> Întrebare <span id="counter"></span>/5</div>
        <div id="question"></div>
        <div class="ans" id="div-ans-a" onclick="selectedAnswer(0)">
          <span class="my-alpha">A</span><span id="ans-a"></span>
        </div>
        <div class="ans" id="div-ans-b" onclick="selectedAnswer(1)">
          <span class="my-alpha">B</span><span id="ans-b"></span>
        </div>
        <div class="ans" id="div-ans-c" onclick="selectedAnswer(2)">
          <span class="my-alpha">C</span><span id="ans-c"></span>
        </div>
        <div class="ans" id="div-ans-d" onclick="selectedAnswer(3)">
          <span class="my-alpha">D</span><span id="ans-d"></span>
        </div>
        <div class="btn">
          <div id="previous" onclick="previousQuestion()">< Întrebarea anterioară</div>
          <div id="next" onclick="nextQuestion()"> Întrebarea următoare ></div>
          <div id="restart" onclick="restartQuestion()">Restart <i class="fas fa-redo"></i></div>
        </div>

        <div id="test-result">
            <img src="photos/Introvert.jpg" id="image" />
            <div id="trait">
              <strong id="trait-title"></strong> <br />
              <div>Câteva aspecte pe care le include personalitatea ta ar fi faptul că:</div>
              <ul id="personalities"></ul><br>
            </div>
              <div id="personality-message" ></div>
              <ul class="nav-bar">
                <h3><strong class="nav-item"><a href="info.html"> Mai multe informatii </a></strong></h3>
              </ul>
          </div>
        </div>
        <div class="your-answers">
          <div class="title">Răspunsurile selectate de tine.</div>
          <div id="answers"></div>
        </div>
      </div>
          </div>
        </div>
        
      </div>
    </div>
    <script src="js/db.js"></script>
    <script src="js/App.js"></script>
  </body>
</html>
